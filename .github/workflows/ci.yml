name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'website/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'website/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Track the latest stable Go rather than go.mod's floor: stdlib CVEs
          # are fixed by patch releases, and pinning the build toolchain to the
          # module's minimum means govulncheck flags every new stdlib CVE until
          # the pin is bumped by hand. go.mod keeps declaring the minimum Go we
          # support.
          go-version: 'stable'
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          unformatted=$(gofmt -l ./cmd ./internal *.go)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"; echo "$unformatted"; exit 1
          fi

      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: latest
          args: check
