name: Security

# SBOMs are generated per release (see .goreleaser.yaml). This workflow re-scans
# dependencies on a schedule so newly disclosed CVEs against unchanged deps are
# caught even when nothing in the repo changed.

on:
  schedule:
    - cron: '23 6 * * 1'  # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 'stable'
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
