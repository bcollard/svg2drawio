<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0" stop-color="#4a90d9"/>
      <stop offset="1" stop-color="#1b4f8a"/>
    </linearGradient>
    <g id="badge">
      <circle cx="0" cy="0" r="12" fill="#f5a623" stroke="#8a5a00" stroke-width="2"/>
      <path d="M -5 0 L -1 4 L 6 -5" fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>
  </defs>

  <rect x="10" y="10" width="120" height="60" fill="url(#grad)" stroke="#123" stroke-width="2"/>
  <rect x="150" y="10" width="120" height="60" rx="12" ry="12" fill="#e8f0fe" stroke="#4a90d9" stroke-width="3"/>
  <circle cx="320" cy="40" r="28" fill="#d0021b" fill-opacity="0.6" stroke="#7a0010"/>
  <ellipse cx="60" cy="130" rx="45" ry="25" fill="none" stroke="#417505" stroke-width="4" stroke-dasharray="8 4"/>

  <line x1="130" y1="120" x2="260" y2="160" stroke="#333" stroke-width="2"/>
  <polyline points="280,110 310,150 340,110 370,150" fill="none" stroke="#9013fe" stroke-width="2"/>
  <polygon points="40,200 90,200 65,250" fill="#50e3c2" stroke="#0a7a68" stroke-width="2"/>

  <path d="M120,200 C150,170 190,230 220,200 S270,170 300,200 L300,250 Q210,280 120,250 Z"
        fill="#ffe08a" stroke="#b07d00" stroke-width="2"/>
  <path d="M320,200 a30,30 0 1,0 60,0 a30,30 0 1,0 -60,0" fill="#bd10e0" opacity="0.5"/>

  <g transform="translate(200,90) rotate(30)">
    <rect x="-30" y="-12" width="60" height="24" fill="#ffffff" stroke="#888"/>
    <text x="0" y="5" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#222">rotated</text>
  </g>

  <text x="20" y="290" font-size="14" font-family="Arial" font-weight="bold" fill="#111">Sample &amp; test
    <tspan x="20" y="272" font-style="italic" font-weight="normal" fill="#666">second line</tspan>
  </text>

  <use xlink:href="#badge" x="360" y="270"/>
</svg>
